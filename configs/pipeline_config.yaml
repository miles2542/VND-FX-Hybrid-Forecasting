active_target: PHP
arima:
  ic: bic
  max_d: 1
  max_p: 5
  max_q: 5
  seasonal: false
baselines:
  enabled: true
  models:
    - rw
    - mean
    - ar1
data:
  end_date: "2026-12-31"
  lag_exogenous: 1
  ml_lags_max: 30
  start_date: "2010-01-01"
  test_ratio: 0.1
  train_ratio: 0.8
  transform: log_returns_100
  val_ratio: 0.1
diagnostics:
  parallel:
    enabled: true
    fallback_to_sequential_on_parallel_error: true
    max_retries_per_series: 1
    n_workers: 6
    retry_backoff_seconds: 1
  run_adf_kpss: true
  run_structural_breaks: true
  structural_breaks:
    compute_heavy_stats: true
    h: 0.15
    max_breaks: 3
    targets:
      - mean
      - variance
    variance_proxy: squared
exogenous:
  us_interest_rate: DFF
  vn_interest_rate: VNREFI
mlp:
  activation: relu
  early_stopping: true
  hidden_layer_sizes:
    - - 10
    - - 20
    - - 50
    - - 10
      - 10
    - - 20
      - 10
  max_iter: 2000
  solver: adam
nonparametric:
  use_tuned_params_if_exists: false # For some reasons I've yet to be able to make tuning results consistently better than default:) So we use default for now
paths:
  processed: data/processed
  raw: data/raw
  results: results
rolling_cv:
  enabled: false
  initial_window: 0.7
  step_size: 30
  window_type: sliding
seed: 42
structural_breaks:
  enabled: true
  ignore_breaks: false
svr:
  C_range:
    - 0.1
    - 1
    - 10
    - 100
    - 1000
  epsilon_range:
    - 0.001
    - 0.01
    - 0.1
  gamma_range:
    - scale
    - 0.01
    - 0.1
    - 1
  kernel: rbf
